input {
  tcp {
    port => 5000
    codec => json_lines
  }
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse timestamp dari Spring Boot log
  if [timestamp] {
    date {
      match => ["timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Tambah field environment
  mutate {
    add_field => { "environment" => "docker" }
  }

  # Parse log level
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }
  # Debug ke stdout (optional, bisa dihapus di production)
  stdout {
    codec => rubydebug
  }
}
