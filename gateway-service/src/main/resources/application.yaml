server:
  port: 9000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: PRODUK
            uri: lb://PRODUK
            predicates:
              - Path=/api/produk/**
          - id: ORDER-SERVICE
            uri: lb://ORDER
            predicates:
              - Path=/api/order/**
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://eureka-server:8761/eureka/
  instance:
    hostname: gateway-service

# Monitoring: Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true